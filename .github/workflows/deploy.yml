name: Cloudflare Deployment
run-name: Cloudflare Deployment
on:
  push:
    branches:
      - main
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
jobs:
  deploy:
    name: Deploy Worker
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Download Secrets
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_BETTER_AUTH_SECRET: ${{ toJSON(secrets.BETTER_AUTH_SECRET) }}
          envkey_BETTER_AUTH_URL: ${{ toJSON(vars.BETTER_AUTH_URL) }}
          envkey_DATABASE_URL: ${{ toJSON(secrets.DATABASE_URL) }}
          envkey_OPENROUTER_API_KEY: ${{ toJSON(secrets.OPENROUTER_API_KEY) }}
          envkey_OPENROUTER_MODEL: ${{ toJSON(vars.OPENROUTER_MODEL) }}
          envkey_OPENROUTER_REFERER: ${{ toJSON(vars.OPENROUTER_REFERER) }}
          envkey_OPENROUTER_TITLE: ${{ toJSON(vars.OPENROUTER_TITLE) }}

      - name: Deploy Worker
        run: just deploy
